[project]
name = "moalmanac-fda-curation"
version = "0.1.0"
description = "Evidence-backed FDA label curation tools and agent skills for MOAlmanac"
requires-python = ">=3.11"
dependencies = [
  "anthropic>=0.68",
  "markitdown[pdf]>=0.1.1",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "requests>=2.31",
]

[project.scripts]
moalmanac-fda-curation = "moalmanac_fda_curation.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
